<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sely's Professional Plumbing Services</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #22c55e;
            --dark-bg: #0b0f19;
            --card-bg: #131c2e;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, rgba(11, 15, 25, 0.94) 0%, rgba(19, 28, 46, 0.96) 100%), 
                        url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container { 
            width: 100%;
            max-width: 500px; 
            padding: 35px 24px; 
            box-sizing: border-box;
            background: rgba(19, 28, 46, 0.8);
            margin: 20px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        
        .logo-box {
            width: 100%;
            max-width: 240px;
            margin: 0 auto 20px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .info-card {
            margin-bottom: 25px;
        }
        .info-card p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin: 0;
        }
        .info-card strong {
            color: #ffffff;
        }
        .accent-text {
            color: #f59e0b;
            font-weight: 600;
            display: block;
            margin-top: 12px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            margin: 16px 0;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        .btn-call { background-color: var(--primary); box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35); }
        .btn-whatsapp { background-color: var(--secondary); box-shadow: 0 4px 20px rgba(34, 197, 94, 0.35); }

        /* Custom Stylish Alert Overlay Box */
        .custom-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .custom-alert-overlay.show {
            opacity: 1;
            visibility: visible;
        }
        .custom-alert-box {
            background: var(--card-bg);
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(59, 130, 246, 0.15);
            padding: 30px 24px;
            border-radius: 20px;
            max-width: 320px;
            width: 85%;
            text-align: center;
            transform: scale(0.85);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .custom-alert-overlay.show .custom-alert-box {
            transform: scale(1);
        }
        .custom-alert-text {
            font-size: 1.15rem;
            font-weight: 600;
            line-height: 1.5;
            color: #ffffff;
            margin: 0 0 20px 0;
        }
        .custom-alert-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
            transition: all 0.2s ease;
        }
        .custom-alert-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <!-- Stylish Pop-up Layout Structure -->
    <div id="customAlert" class="custom-alert-overlay">
        <div class="custom-alert-box">
            <p class="custom-alert-text">Save it, you might need it</p>
            <button class="custom-alert-btn" onclick="closeAlert()">Got it</button>
        </div>
    </div>

    <div class="container">
        <div class="logo-box">
            <img src="logo.png" alt="Sely's Plumbing Logo">
        </div>

        <div class="info-card">
            <p>Based <strong>all over Jounieh</strong>, providing premium residential installations and pipeline support. Available <strong>all over Lebanon</strong> for emergency service interventions.</p>
            <span class="accent-text">🚨 24/7 Emergency Repairs & PPR Support</span>
        </div>

        <a href="tel:+96170100177" class="btn btn-call">📞 Tap to Call</a>
        <a href="whatsapp://send?phone=96170100177&text=Hi%20Sely,%20I%20need%20a%20plumbing%20estimate." class="btn btn-whatsapp">💬 Text on WhatsApp</a>
    </div>

    <script>
        // Trigger the stylish custom alert window seamlessly
        window.addEventListener('DOMContentLoaded', (event) => {
            setTimeout(() => {
                document.getElementById('customAlert').classList.add('show');
            }, 400);
        });

        // Hide alert window logic
        function closeAlert() {
            document.getElementById('customAlert').classList.remove('show');
        }

        (function() {
            if (!window.location.search.includes('v=')) {
                window.location.search = '?v=' + new Date().getTime();
            }
        })();
    </script>
</body>
</html>
