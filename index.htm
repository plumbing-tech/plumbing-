<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Sely's Professional Plumbing Services</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #22c55e;
            --dark-bg: #0b0f19;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, rgba(11, 15, 25, 0.94) 0%, rgba(19, 28, 46, 0.96) 100%), 
                        url('https://unsplash.com');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        .container { 
            width: 100%;
            max-width: 500px; 
            padding: 35px 24px; 
            box-sizing: border-box;
            background: rgba(19, 28, 46, 0.8);
            margin: 20px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 1;
        }
        
        .logo-box {
            width: 100%;
            max-width: 240px;
            margin: 0 auto 20px auto;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .logo-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .info-card {
            margin-bottom: 25px;
        }
        .info-card p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin: 0;
        }
        .info-card strong {
            color: #ffffff;
        }
        .accent-text {
            color: #f59e0b;
            font-weight: 600;
            display: block;
            margin-top: 12px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            margin: 16px 0;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        .btn-call { background-color: var(--primary); box-shadow: 0 4px 20px rgba(59, 130, 246, 0.35); }
        .btn-whatsapp { background-color: var(--secondary); box-shadow: 0 4px 20px rgba(34, 197, 94, 0.35); }

        /* Premium Custom Notification Overlay System */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 15, 25, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .custom-popup {
            width: 100%;
            max-width: 500px;
            background: rgba(30, 41, 59, 0.9);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px 24px 0 0;
            padding: 30px 24px 40px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        .modal-overlay.show .custom-popup {
            transform: translateY(0);
        }
        .popup-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 10px 0;
        }
        .popup-text {
            font-size: 1rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0 0 24px 0;
        }
        .popup-close-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
            transition: background 0.2s;
            width: 100%;
        }
        .popup-close-btn:active { background-color: #2563eb; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Displaying Your Professional Logo Image -->
        <div class="logo-box">
            <img src="logo.png" alt="Sely's Plumbing Logo">
        </div>

        <div class="info-card">
            <p>Based <strong>all over Jounieh</strong>, providing premium residential installations and pipeline support. Available <strong>all over Lebanon</strong> for emergency service interventions.</p>
            <span class="accent-text">🚨 24/7 Emergency Repairs & PPR Support</span>
        </div>

        <a href="tel:+96170100177" class="btn btn-call">📞 Tap to Call</a>
        <a href="whatsapp://send?phone=96170100177&text=Hi%20Sely,%20I%20need%20a%20plumbing%20estimate." class="btn btn-whatsapp">💬 Text on WhatsApp</a>
    </div>

    <!-- UI Overlay for Modern Custom Prompt Layout -->
    <div id="popupModal" class="modal-overlay">
        <div class="custom-popup">
            <h2 class="popup-title">Sely's Plumbing Support</h2>
            <p class="popup-text">Save it, you might need it</p>
            <button class="popup-close-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        // Triggers the custom design slide-up popup interface smoothly
        window.addEventListener('DOMContentLoaded', (event) => {
            setTimeout(() => {
                document.getElementById('popupModal').classList.add('show');
            }, 500);
        });

        function closePopup() {
            document.getElementById('popupModal').classList.remove('show');
        }

        // Cache-Busting Utility
        (function() {
            if (!window.location.search.includes('v=')) {
                window.location.search = '?v=' + new Date().getTime();
            }
        })();
    </script>
</body>
</html>
