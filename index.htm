<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>S.K's Professional Plumbing Services</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #22c55e;
            --dark-bg: #0b111e;
            --card-bg: rgba(19, 28, 46, 0.75);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            /* Premium Radial Dark Mesh Background */
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(29, 78, 216, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(34, 197, 94, 0.08) 0px, transparent 50%),
                radial-gradient(at 50% 100%, rgba(59, 130, 246, 0.12) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated Floating Background Elements */
        .bg-glow-1 {
            position: fixed;
            top: 20%;
            left: 10%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }
        .bg-glow-2 {
            position: fixed;
            bottom: 15%;
            right: 5%;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(34, 197, 94, 0.05) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            animation: floatGlow 18s infinite alternate-reverse ease-in-out;
        }

        @keyframes floatGlow {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-40px) scale(1.1); }
        }
        
        .container { 
            width: 100%;
            max-width: 460px; 
            padding: 40px 28px; 
            box-sizing: border-box;
            background: var(--card-bg);
            margin: 20px;
            border-radius: 28px;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            z-index: 1;
        }

        .logo-box {
            width: 100%;
            max-width: 220px;
            margin: 0 auto 24px auto;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .logo-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .info-card {
            margin-bottom: 30px;
        }
        .info-card p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-muted);
            margin: 0;
        }
        .info-card strong {
            color: #ffffff;
            font-weight: 600;
        }
        .accent-text {
            color: #f59e0b;
            font-weight: 600;
            display: inline-block;
            margin-top: 16px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            background: rgba(245, 158, 11, 0.1);
            padding: 6px 14px;
            border-radius: 30px;
            border: 1px solid rgba(245, 158, 11, 0.15);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 16px 0;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.15rem;
            color: white;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }
        .btn:active { transform: scale(0.97); opacity: 0.9; }
        .btn-call { 
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); 
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3); 
        }
        .btn-whatsapp { 
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); 
            box-shadow: 0 4px 20px rgba(34, 197, 94, 0.3); 
        }

        /* Premium Custom Notification Overlay System */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 10, 18, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 999;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        .custom-popup {
            width: 100%;
            max-width: 500px;
            background: rgba(20, 29, 47, 0.98);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 1px solid rgba(255, 255, 255, 0.08);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 28px 28px 0 0;
            padding: 35px 24px 45px;
            box-sizing: border-box;
            text-align: center;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6);
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        .modal-overlay.show .custom-popup {
            transform: translateY(0);
        }
        .popup-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin: 0 0 12px 0;
        }
        .popup-text {
            font-size: 1.1rem;
            color: #e2e8f0;
            font-weight: 500;
            line-height: 1.5;
            margin: 0 0 28px 0;
        }
        .popup-close-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            transition: transform 0.2s;
            width: 100%;
        }
        .popup-close-btn:active { transform: scale(0.98); }
    </style>
</head>
<body>

    <!-- Stylish Moving Background Orbs -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <!-- Displaying Your Professional Logo Image -->
        <div class="logo-box">
            <img src="s.k.png" alt="S.K's Plumbing Logo">
        </div>

        <div class="info-card">
            <p>Based <strong>all over Jounieh</strong>, providing premium residential installations and pipeline support. Available <strong>all over Lebanon</strong> for emergency service interventions.</p>
            <span class="accent-text">🚨 24/7 Emergency Repairs & PPR Support</span>
        </div>

        <a href="tel:+96170100177" id="btn-call-text" class="btn btn-call">📞 Tap to Call</a>
        <a href="whatsapp://send?phone=96170100177&text=Hi%20S.K,%20I%20need%20a%20plumbing%20estimate." id="btn-wa-text" class="btn btn-whatsapp">💬 Text on WhatsApp</a>
    </div>

    <!-- UI Overlay for Modern Custom Prompt Layout -->
    <div id="popupModal" class="modal-overlay">
        <div class="custom-popup">
            <h2 class="popup-title">S.K's Plumbing Support</h2>
            <p class="popup-text">Save it, you might need it</p>
            <button class="popup-close-btn" onclick="closePopup()">OK</button>
        </div>
    </div>

    <script>
        // Triggers the glass slide popup overlay interface smoothly
        window.addEventListener('DOMContentLoaded', (event) => {
            setTimeout(() => {
                document.getElementById('popupModal').classList.add('show');
            }, 500);
        });

        function closePopup() {
            document.getElementById('popupModal').classList.remove('show');
        }

        // Automatic Cache-Buster
        (function() {
            if (!window.location.search.includes('v=')) {
                window.location.search = '?v=' + new Date().getTime();
            }
        })();
    </script>
</body>
</html>
