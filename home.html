<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sely's Professional Plumbing Services</title>
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #22c55e;
            --dark-bg: #0b0f19;
            --text-main: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--dark-bg);
            color: var(--text-main);
            -webkit-tap-highlight-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container { 
            width: 100%;
            max-width: 500px; 
            padding: 20px; 
            box-sizing: border-box;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 16px 0;
            border-radius: 16px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.25rem;
            color: white;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        .btn-call { background-color: var(--primary); box-shadow: 0 4px 20px rgba(59, 130, 246, 0.4); }
        .btn-whatsapp { background-color: var(--secondary); box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4); }
    </style>
</head>
<body>

    <div class="container">
        <a href="tel:+96170100177" class="btn btn-call">📞 Tap to Call and Request a Quote</a>
        <a href="whatsapp://send?phone=96170100177&text=Hi%20Sely,%20I%20need%20a%20plumbing%20estimate." class="btn btn-whatsapp">💬 Text on WhatsApp</a>
    </div>

</body>
</html>
